name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 60 https://fixd-api.onrender.com/api/health && exit 0
            sleep 10
          done
          exit 1

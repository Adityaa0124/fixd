services:
  - type: web
    name: fixd-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm ci && npm run db:generate -w @fixd/server
    startCommand: npm run start -w @fixd/server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: FIXD_OFFLINE
        value: "1"
      - key: RERUN_PER_HOUR
        value: "10"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true

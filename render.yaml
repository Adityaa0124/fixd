services:
  - type: web
    name: fixd-api
    runtime: node
    plan: free
    # Same region as the Neon database (aws us-east-2). Each request runs several queries,
    # so API to DB latency dominates; a cross Pacific hop made every action take seconds.
    region: ohio
    rootDir: .
    buildCommand: npm ci && npm run db:generate -w @fixd/server
    startCommand: npm run start -w @fixd/server
    # No database access: a sleeping Neon compute must not fail the health check.
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: FIXD_OFFLINE
        value: "1"
      - key: DEMO_RESET_PER_HOUR
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
